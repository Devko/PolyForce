# The release build. The plugin catalog (sd88me/mpc-vst-plugins) lists only plugins that need glibc 2.32 or
# less, so they load on MPC OS 2.x as well as 3.x: the device build runs in arm32v7/gcc:11-bullseye (GCC 11,
# glibc 2.31) under QEMU, as the catalog's own ports do, profile-guided, and the test suite runs against the
# objects the .so is linked from. The sanitizer suite runs on x86. The zip is checked with the catalog's
# checker and kept as an artifact; a vX.Y.Z tag also publishes it as a GitHub release (a prerelease while the
# version is 0.x: the catalog's beta channel).
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test suite (x86, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make test

  device:
    name: Device build (armhf, glibc 2.31, PGO), package, catalog check
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the release, on a tag
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build and test in arm32v7/gcc:11-bullseye
        run: |
          case "$GITHUB_REF" in refs/tags/v*) version="PLUGIN_VERSION=${GITHUB_REF_NAME#v}" ;; *) version= ;; esac
          docker run --rm --platform linux/arm/v7 -v "$PWD:/w" -w /w arm32v7/gcc:11-bullseye bash -euc "
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends make python3 python3-pil >/dev/null
            make ARM_PREFIX= ARM_RUN= PGO=1 $version plugin-package test-arm-pgo"
      - name: Catalog check
        run: >-
          python3 third_party/mpc-vst-plugins/tools/catalog_check.py dist/*-mpc-armv7.zip
          --catalog --expect-id polyforce --expect-repo Devko/PolyForce
      - uses: actions/upload-artifact@v4
        with:
          name: PolyForce-mpc-armv7
          path: dist/*-mpc-armv7.zip
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-mpc-armv7.zip
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
